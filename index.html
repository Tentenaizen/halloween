<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do you know me?</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --navy: #263845;
    --yellow-1: #B59200;
    --yellow-2: #8F7300;
    --pink: #ffb7c5;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, var(--yellow-1) 0%, var(--yellow-2) 100%);
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }
  
  div p {
    text-align: center;
    color: #fff;
  }
  /* Dog ears in the corners */
  .ear {
    position: absolute;
    width: 160px;
    height: 160px;
    background: var(--navy);
    border-radius: 50%;
    opacity: 0.95;
  }
  .ear.left  { top: -70px; left: -70px; }
  .ear.right { top: -70px; right: -70px; }

  .wrap {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  /* Dog face */
  .face {
    position: relative;
    width: 200px;
    height: 120px;
    margin-bottom: -30px;
    z-index: 2;
  }
  .eye {
    position: absolute;
    top: 0;
    width: 30px;
    height: 30px;
    background: var(--navy);
    border-radius: 50%;
    animation: blink 4s infinite;
  }
  .eye::after {
    content: "";
    position: absolute;
    top: 6px;
    left: 7px;
    width: 9px;
    height: 9px;
    background: #fff;
    border-radius: 50%;
  }
  .eye.l { left: 30px; }
  .eye.r { right: 30px; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  .nose {
    position: absolute;
    top: 42px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px;
    height: 30px;
    background: var(--navy);
    border-radius: 50% 50% 45% 45%;
  }
  .mouth {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    width: 115px;
    height: 40px;
    border-bottom: 6px solid var(--navy);
    border-radius: 0 0 60px 60px;
  }
  .tongue {
    position: absolute;
    top: 68px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 44px;
    background: var(--pink);
    border-radius: 0 0 20px 20px;
    border: 3px solid var(--navy);
    border-top: none;
    transform-origin: top center;
    animation: wiggle 2.5s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: translateX(-50%) rotate(0deg); }
    50%      { transform: translateX(-50%) rotate(6deg); }
  }

  /* Card */
  .card {
    width: 100%;
    background: transparent;
    position: relative;
    padding-top: 10px;
  }

  /* Paws peeking over the first input */
  .paw {
    position: absolute;
    top: -22px;
    width: 46px;
    height: 36px;
    background: #fff;
    border: 3px solid var(--navy);
    border-radius: 22px 22px 12px 12px;
    z-index: 3;
  }
  .paw::before, .paw::after {
    content: "";
    position: absolute;
    top: -2px;
    width: 10px;
    height: 10px;
    background: #fff;
    border: 3px solid var(--navy);
    border-radius: 50%;
  }
  .paw::before { left: 4px; top: -10px; }
  .paw::after  { right: 4px; top: -10px; }
  .paw.left  { left: 60px; }
  .paw.right { right: 60px; }

  .field {
    background: #fff;
    border-radius: 14px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 0 rgba(38, 56, 69, 0.15);
    height: 56px;
    position: relative;
  }
  .field .icon {
    font-size: 1.2rem;
    margin-right: 12px;
    width: 22px;
    text-align: center;
  }
  .field input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 1rem;
    font-family: inherit;
    color: var(--navy);
    background: transparent;
    height: 100%;
  }
  .field input::placeholder {
    color: #aab3ba;
  }
  .field:focus-within {
    box-shadow: 0 4px 0 var(--navy);
  }

  button {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 14px;
    background: var(--navy);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 0 #111c24;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #111c24; }

  /* Hidden reveal overlay */
  #reveal {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
  }
  #reveal.show { display: flex; }

  #reveal img {
    max-width: 90vmin;
    max-height: 80vh;
    border-radius: 20px;
    animation: jolt 0.4s steps(2) 3, flicker 0.15s infinite alternate;
  }
  @keyframes jolt {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-12px, 6px); }
    50%  { transform: translate(14px, -8px); }
    75%  { transform: translate(-8px, -4px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes flicker {
    from { opacity: 1; }
    to   { opacity: 0.85; }
  }

  #reveal .close {
    margin-top: 20px;
    width: auto;
    height: auto;
    padding: 8px 24px;
    background: #333;
    box-shadow: none;
    font-size: 0.95rem;
  }
  #reveal .close:hover { background: #555; transform: none; }

  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 11;
  }
  .flash.on { animation: flash 0.35s ease-out; }
  @keyframes flash {
    0%   { opacity: 0.9; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

<div class="ear left"></div>
<div class="ear right"></div>

<div class="wrap">
  <div class="face">
    <div class="eye l"></div>
    <div class="eye r"></div>
    <div class="nose"></div>
    <div class="mouth"></div>
    <div class="tongue"></div>
  </div>

  <div class="card">
    <span class="paw left"></span>
    <span class="paw right"></span>

    <form id="aboutForm">
      
      <div>
        <p>Kilala mo ba ako? Try mo nga na sagutan ito!</p>
      </div>
      
      <div class="field">
        <span class="icon"></span>
        <input type="text" id="name" placeholder="Ano ang palayaw ko?" required>
      </div>

      <div class="field">
        <span class="icon"></span>
        <input type="text" id="color" placeholder="Ano ang paborito kong kulay?" required>
      </div>

      <button type="submit">Isumite</button>
    </form>
  </div>
</div>

<div class="flash" id="flash"></div>

<div id="reveal">
  <img src="image.png" alt="">
  <button class="close" id="closeBtn">Isara</button>
</div>

<script>
  const form = document.getElementById('aboutForm');
  const reveal = document.getElementById('reveal');
  const flash = document.getElementById('flash');
  const closeBtn = document.getElementById('closeBtn');

  // Ang sarili mong sound file
  const scareSound = new Audio('scary.mp3');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    flash.classList.remove('on');
    void flash.offsetWidth;
    flash.classList.add('on');

    reveal.classList.add('show');

    scareSound.currentTime = 0;
    scareSound.play();
  });

  closeBtn.addEventListener('click', () => {
    reveal.classList.remove('show');
    scareSound.pause();
    form.reset();
  });
</script>

</body>
</html>
